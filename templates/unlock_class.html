<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='icons/favicon-64.png') }}">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="세종고 포털">
<title>클래스 잠금 해제</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-container">
    <p class="back-wrap">
      <a class="back-btn" href="{{ url_for('main') }}">← 메인으로</a>
    </p>

    <h1>{{ grade }}학년 {{ classroom }}반</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">
          {% for message in messages %}
            {{ message }}
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <p class="subtitle">이 클래스에 접근하려면 초대 코드가 필요합니다.</p>

    <form method="post" action="{{ url_for('unlock_class', grade=grade, classroom=classroom) }}" autocomplete="off" novalidate>
      <div class="input-group">
        <label>초대 코드
          <div class="field">
            <input name="invite_code" type="text" required autofocus placeholder="초대 코드를 입력하세요">
          </div>
        </label>
      </div>

      <button type="submit" class="submit-btn">입장하기</button>
    </form>

  </div>
  <script src="{{ url_for('static', filename='js/pwa.js') }}?v={{ cache_buster|default(1) }}" defer></script>
</body>
</html>
