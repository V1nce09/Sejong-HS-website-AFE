<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='icons/favicon-64.png') }}">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="세종고 포털">
  <title>회원가입 | 세종고 포털</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='js/csrf.js') }}?v={{ cache_buster|default(1) }}" defer></script>
</head>
<body class="auth-page auth-register-page">
  <main class="auth-shell auth-shell-wide">
    <header class="auth-brandbar">
      <a class="auth-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/school-logo.png') }}" alt="세종고등학교 로고">
        <span><strong>세종고 포털</strong><small>Sjh Portal</small></span>
      </a>
      <a class="auth-back-link" href="{{ url_for('login') }}">로그인</a>
    </header>

    <section class="auth-content">
      <div class="auth-heading">
        <span class="auth-section-label">ACCOUNT</span>
        <h1>회원가입</h1>
      </div>

      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

      <form method="post" autocomplete="off" novalidate id="registerForm" class="auth-form auth-register-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>아이디
          <input name="userid" type="text" required autofocus autocomplete="username">
        </label>
        <label>이름
          <input name="name" type="text" required autocomplete="name">
        </label>
        <div class="auth-form-row">
          <label>비밀번호
            <span class="auth-password-field">
              <input id="pwd" name="password" type="password" required autocomplete="new-password">
              <button type="button" class="toggle-btn" data-target="pwd" aria-label="비밀번호 표시">보기</button>
            </span>
          </label>
          <label>비밀번호 확인
            <span class="auth-password-field">
              <input id="pwd2" name="password2" type="password" required autocomplete="new-password">
              <button type="button" class="toggle-btn" data-target="pwd2" aria-label="비밀번호 표시">보기</button>
            </span>
          </label>
        </div>
        <div class="auth-password-help">
          <small id="pwHint">소문자·대문자·숫자·특수문자 중 3가지 이상 사용</small>
          <small id="pwWarning" hidden></small>
        </div>
        <label>학번
          <input id="student_no" name="student_no" type="text" inputmode="numeric" pattern="\d{5}" maxlength="5" placeholder="5자리">
        </label>
        <button type="submit" class="auth-submit" id="submitBtn">회원가입</button>
      </form>

      <div class="auth-footer-link">
        <span>이미 계정이 있나요?</span>
        <a href="{{ url_for('login') }}">로그인</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/register.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}?v={{ cache_buster|default(1) }}" defer></script>
</body>
</html>
