<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='icons/favicon-64.png') }}">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="세종고 포털">
<title>로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <!-- 뒤로가기 (히스토리 우선, 없으면 인덱스로 이동) -->
        <p class="back-wrap">
            <a class="back-btn" href="{{ url_for('main') }}">메인으로</a>
        </p>

        <h2 class="site-title">세종고 포털</h2>
        <form method="POST">
            <input type="text" name="userid" placeholder="아이디" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit" class="btn">로그인</button>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
        </form>

        <p style="margin-top:12px; text-align:center;">
            <a href="{{ url_for('register') }}" class="signup-link">회원가입</a>
        </p>
    </div>
  <script src="{{ url_for('static', filename='js/pwa.js') }}?v={{ cache_buster|default(1) }}" defer></script>
</body>
</html>
